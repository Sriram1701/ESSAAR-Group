<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 84" width="440" height="84">
  <defs>
    <linearGradient id="lightSpine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="goldBarGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#EED596" />
      <stop offset="100%" stop-color="#C9A34E" />
    </linearGradient>
    <linearGradient id="goldBarMidLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C478" />
      <stop offset="100%" stop-color="#F3DFAB" />
    </linearGradient>
    <filter id="softGlowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Geometric E Monogram (Light for Dark Backgrounds) -->
  <g id="monogram-light" filter="url(#softGlowLight)">
    <!-- Primary Vertical Spine -->
    <rect x="12" y="11" width="13" height="62" rx="3" fill="url(#lightSpine)" />
    <!-- Architectural Bevel Line on Spine -->
    <rect x="23" y="14" width="2" height="56" rx="1" fill="#C9A34E" opacity="0.85" />
    
    <!-- Top Cantilever Bar -->
    <path d="M 29 11 L 70 11 A 3 3 0 0 1 73 14 L 73 21 A 3 3 0 0 1 70 24 L 29 24 A 2 2 0 0 1 27 22 L 27 13 A 2 2 0 0 1 29 11 Z" fill="url(#goldBarGradLight)" />
    
    <!-- Middle Cantilever Bar -->
    <path d="M 29 35.5 L 59 35.5 A 3 3 0 0 1 62 38.5 L 62 45.5 A 3 3 0 0 1 59 48.5 L 29 48.5 A 2 2 0 0 1 27 46.5 L 27 37.5 A 2 2 0 0 1 29 35.5 Z" fill="url(#goldBarMidLight)" />
    
    <!-- Bottom Cantilever Bar -->
    <path d="M 29 60 L 70 60 A 3 3 0 0 1 73 63 L 73 70 A 3 3 0 0 1 70 73 L 29 73 A 2 2 0 0 1 27 71 L 27 62 A 2 2 0 0 1 29 60 Z" fill="url(#goldBarGradLight)" />
    
    <!-- Precision Connector Accent -->
    <rect x="25" y="39.5" width="2" height="5" rx="1" fill="#C9A34E" />
  </g>

  <!-- Elegant Vertical Divider -->
  <line x1="88" y1="13" x2="88" y2="71" stroke="#C9A34E" stroke-width="1.25" stroke-opacity="0.6" stroke-linecap="round" />

  <!-- Typography Wordmark & Hierarchy -->
  <g id="wordmark-light" transform="translate(104, 0)">
    <!-- Main Brand Name: ESSAAR in Pure White -->
    <text x="0" y="38" font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="29" letter-spacing="0.14em" fill="#FFFFFF">ESSAAR</text>
    
    <!-- Sub-heading: GROUP OF COMPANIES in Gold -->
    <text x="1.5" y="54" font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.32em" fill="#E5C478">GROUP OF COMPANIES</text>
    
    <!-- Tagline: ONE GROUP. MANY STRENGTHS. ONE VISION. -->
    <text x="1.5" y="69.5" font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="7" letter-spacing="0.18em" fill="#94A3B8">ONE GROUP. MANY STRENGTHS. ONE VISION.</text>
  </g>
</svg>
